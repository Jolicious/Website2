<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Please Take a Number</title>
<style>
:root{--paper:#f1eadb;--ink:#25221e;--red:#b23a32;--rule:#cfc4b0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}.page{width:min(680px,calc(100% - 40px));margin:0 auto;padding:54px 0 34px}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--ink);padding-bottom:12px}.kicker{font:700 12px/1.2 Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase}.date{font:12px Arial,sans-serif;color:#756d62}h1{font-size:clamp(48px,11vw,88px);line-height:.88;letter-spacing:-.07em;max-width:570px;margin:64px 0 22px;font-weight:700}.intro{font-size:20px;line-height:1.45;max-width:470px;margin-bottom:52px}.machine{border:2px solid var(--ink);background:#e8dfcf;padding:26px;box-shadow:10px 10px 0 var(--red)}.machine-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:17px}.machine-label{font:700 13px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.light{width:11px;height:11px;border-radius:50%;background:var(--red)}.display{padding:26px 0 23px;font-size:25px;min-height:83px}.number{font-size:70px;line-height:.9;color:var(--red);letter-spacing:-.06em}button{width:100%;padding:17px;background:var(--ink);color:var(--paper);border:0;font:700 16px Arial,sans-serif;cursor:pointer}button:hover{background:var(--red)}button:active{transform:translateY(2px)}.receipt{display:none;margin-top:26px;border-top:1px dashed var(--ink);padding-top:20px;font:13px/1.65 Arial,sans-serif}.receipt.show{display:block}.fine{margin-top:58px;display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--rule);padding-top:14px;color:#756d62;font:12px/1.4 Arial,sans-serif}@media(max-width:500px){.page{padding-top:30px}.date{display:none}h1{margin-top:48px}.machine{padding:20px;box-shadow:7px 7px 0 var(--red)}}
+</style>
+</head><body><main class="page"><header><div class="kicker">The Department of Waiting</div><div class="date" id="date"></div></header><h1>Please take a number.</h1><p class="intro">There is no queue, no appointment, and nobody ahead of you. Still, it feels important to be organised about this.</p><section class="machine" aria-label="Ticket machine"><div class="machine-top"><div class="machine-label">Now serving</div><div class="light"></div></div><div class="display" id="display">The machine is ready.</div><button id="ticket">Take a number</button><div class="receipt" id="receipt"></div></section><div class="fine"><span>Office hours: whenever</span><span>Window 01 is closed</span></div></main>
+<script>const display=document.querySelector('#display'),receipt=document.querySelector('#receipt'),date=document.querySelector('#date'),reasons=['the queue has developed a mild opinion','someone is looking for a pen','the clerk went to admire a cloud','your number is being laminated','the previous number was suspicious'];let number=0;date.textContent=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});document.querySelector('#ticket').addEventListener('click',()=>{number=number?number+1:Math.floor(Math.random()*18)+12;display.innerHTML='A-<span class="number">'+String(number).padStart(3,'0')+'</span>';receipt.classList.add('show');receipt.textContent='Please keep this number. Your estimated wait is somewhere between now and later because '+reasons[Math.floor(Math.random()*reasons.length)]+'.'});</script></body></html>

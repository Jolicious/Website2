<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Midnight Snack</title>
<style>
:root{--ink:#211d2b;--cream:#f8f0dd;--pink:#e56b86;--yellow:#f5c95b}*{box-sizing:border-box}body{margin:0;background:#211d2b;color:var(--cream);font-family:Georgia,serif;min-height:100vh;display:grid;place-items:center;padding:20px;overflow:hidden}.wrap{width:min(760px,100%)}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}h1{font-size:clamp(38px,8vw,68px);letter-spacing:-.07em;line-height:.85;margin:0}.tag{font:700 11px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}.sub{color:#bcb3c4;font-size:15px;margin:10px 0 0}.hud{display:flex;gap:20px;align-items:center;background:#302a3c;border:1px solid #50455d;padding:11px 14px;font:700 13px Arial,sans-serif}.hud span{color:var(--yellow)}.gamebox{position:relative;border:3px solid var(--cream);background:#8d7081;box-shadow:8px 8px 0 var(--pink);border-radius:4px;overflow:hidden}.gamebox:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,#fff1 0 2%,transparent 2% 48%,#0001 48% 50%,transparent 50%)}canvas{display:block;width:100%;height:auto;image-rendering:auto}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#211d2bdd;text-align:center;padding:24px}.overlay[hidden]{display:none}.card{max-width:380px}.card h2{font-size:43px;line-height:.95;margin:0 0 12px}.card p{color:#c8bfcd;line-height:1.5;margin:0 0 20px}.button{border:0;background:var(--yellow);color:var(--ink);padding:13px 22px;font:700 14px Arial,sans-serif;border-radius:2px;cursor:pointer}.button:hover{background:#ffe28a}.controls{display:flex;justify-content:center;gap:8px;margin-top:18px}.controls button{width:48px;height:40px;border:1px solid #66596f;background:#302a3c;color:var(--cream);font-size:18px;border-radius:4px}.controls button:active{background:var(--pink)}@media(min-width:650px){.controls{display:none}}
</style></head><body><main class="wrap"><header><div><div class="tag">A tiny game for a large appetite</div><h1>Midnight Snack</h1><p class="sub">The house is asleep. The fish are not going to eat themselves.</p></div><div class="hud">FISH <span id="score">0</span> &nbsp; TIME <span id="time">30</span></div></header><div class="gamebox"><canvas id="game" width="720" height="430"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">Midnight Snack</h2><p id="message">Collect the fish. Avoid the vacuum. Use arrow keys or WASD.</p><button class="button" id="start">Start sneaking</button></div></div></div><div class="controls"><button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></div></main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height,scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),message=document.querySelector('#message');let cat,fish,vacuum,score,time,running,last,raf,keys={};
function reset(){cat={x:90,y:H-75,r:18,s:4};fish=[];for(let i=0;i<7;i++)fish.push({x:45+Math.random()*(W-90),y:50+Math.random()*(H-100),r:10});vacuum={x:W-100,y:70,r:21,vx:2.1};score=0;time=30;scoreEl.textContent=0;timeEl.textContent=30}
function circle(a,b,d){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#9c7b86';x.fillRect(0,0,W,H);x.fillStyle='#b28f92';for(let i=0;i<12;i++)x.fillRect(i*72,0,2,H);x.fillStyle='#785b70';x.fillRect(0,H-38,W,38);x.fillStyle='#d3b1a0';x.fillRect(0,31,W,5);fish.forEach(f=>{x.fillStyle='#f5c95b';x.beginPath();x.ellipse(f.x,f.y,14,9,0,0,7);x.fill();x.fillStyle='#e56b86';x.beginPath();x.moveTo(f.x-12,f.y);x.lineTo(f.x-23,f.y-8);x.lineTo(f.x-23,f.y+8);x.fill();x.fillStyle='#211d2b';x.beginPath();x.arc(f.x+7,f.y-2,2,0,7);x.fill()});x.save();x.translate(vacuum.x,vacuum.y);x.fillStyle='#564b67';x.fillRect(-22,-14,44,28);x.fillStyle='#f5c95b';x.fillRect(-12,-8,9,6);x.fillStyle='#211d2b';x.fillRect(-24,14,8,5);x.fillRect(16,14,8,5);x.strokeStyle='#564b67';x.lineWidth=6;x.beginPath();x.moveTo(20,-10);x.quadraticCurveTo(45,-38,36,-58);x.stroke();x.restore();x.fillStyle='#211d2b';x.beginPath();x.arc(cat.x,cat.y,cat.r,0,7);x.fill();x.fillStyle='#e56b86';x.beginPath();x.moveTo(cat.x-14,cat.y-12);x.lineTo(cat.x-12,cat.y-29);x.lineTo(cat.x-2,cat.y-17);x.moveTo(cat.x+14,cat.y-12);x.lineTo(cat.x+12,cat.y-29);x.lineTo(cat.x+2,cat.y-17);x.fill();x.fillStyle='#f8f0dd';x.beginPath();x.arc(cat.x-6,cat.y-3,3,0,7);x.arc(cat.x+6,cat.y-3,3,0,7);x.fill()}
function loop(t){if(!running)return;let dt=Math.min((t-last)/16,3);last=t;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx||dy){let n=Math.hypot(dx,dy);cat.x+=dx/n*cat.s*dt;cat.y+=dy/n*cat.s*dt}cat.x=Math.max(25,Math.min(W-25,cat.x));cat.y=Math.max(50,Math.min(H-55,cat.y));vacuum.x+=vacuum.vx*dt;if(vacuum.x<35||vacuum.x>W-35)vacuum.vx*=-1;fish=fish.filter(f=>{if(circle(cat,f)){score++;scoreEl.textContent=score;return false}return true});if(circle(cat,vacuum)){end(false);return}time-=dt/60;if(time<=0){end(true);return}timeEl.textContent=Math.ceil(time);draw();raf=requestAnimationFrame(loop)}
function start(){reset();running=true;overlay.hidden=true;last=performance.now();draw();raf=requestAnimationFrame(loop)}function end(won){running=false;cancelAnimationFrame(raf);title.textContent=won?'Kitchen cleared':'The vacuum got you';message.textContent=won?'A perfect midnight operation. You found every fish.':'The floor is clean, but your dignity is not. Fish collected: '+score;overlay.hidden=false}document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.key]=true;b.onpointerup=b.onpointerleave=()=>keys[b.dataset.key]=false});document.querySelector('#start').onclick=start;reset();draw();
</script></body></html>
